name: Tactics (Core chess engine tactical tests)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-run-tactics-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Build Tools
        run: sudo apt-get update && sudo apt-get install -y make gcc

      - name: Build all (default target)
        run: make

      - name: Run tactics tests
        run: ./build/tactics_test
