name: Weekly Deep Perft Regression

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

jobs:
  deep-perft:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Build project
        run: |
          make -j$(nproc)

      - name: Run deep perft runner and capture output
        run: |
          mkdir -p perft-artifacts/deep
          # Replace `runfile-deep` with your deep runfile or args
          ./build/perft_runner runfile-deep | tee perft-artifacts/deep/perft-runfile-deep.out || true
          # Treat lines starting with "OK " or "#" as success/comments; anything else fails.
          if tail -n +1 perft-artifacts/deep/perft-runfile-deep.out | grep -qvE '^(OK |#|$)'; then
            echo "::error::Deep perft regression detected: non-OK lines present"
            echo "----- snippet of output -----"
            tail -n 400 perft-artifacts/deep/perft-runfile-deep.out || true
            exit 1
          else
            echo "All deep perft tests reported OK or were comments"
          fi

      - name: Upload deep perft logs
        uses: actions/upload-artifact@v4
        with:
          name: perft-run-logs-deep
          path: perft-artifacts/deep/
