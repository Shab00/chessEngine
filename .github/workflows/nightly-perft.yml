name: Nightly Perft Regression

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: perft-regression
  cancel-in-progress: true

jobs:
  build-and-run-perft:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Build project
        run: |
          make -j$(nproc)

      - name: Run perft runner and capture output
        run: |
          mkdir -p perft-artifacts
          ./build/perft_runner runfile | tee perft-artifacts/perft-runfile.out || true
          # Fail if any non-comment/non-OK lines exist in the output.
          # Lines starting with "OK " or "#" are considered successful or comments.
          if tail -n +1 perft-artifacts/perft-runfile.out | grep -qvE '^(OK |#|$)'; then
            echo "::error::Perft regression detected: non-OK lines present in perft-runfile.out"
            echo "----- snippet of output -----"
            tail -n 200 perft-artifacts/perft-runfile.out || true
            exit 1
          else
            echo "All perft tests reported OK or were comments"
          fi

      - name: Upload perft run logs
        uses: actions/upload-artifact@v4
        with:
          name: perft-run-logs
          path: perft-artifacts/
