name: perft tests

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * *'

jobs:
  test:
    name: perft tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make test scripts executable
        run: chmod +x tests/run_perft_tests.sh tests/run_fen_tests.sh

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc make

      - name: Build
        run: make

      - name: Run perft + fen tests (release)
        run: |
          ./tests/run_perft_tests.sh
          ./tests/run_fen_tests.sh

      - name: Build (DEBUG) and run tests
        run: |
          CFLAGS="-DDEBUG -g" make clean
          CFLAGS="-DDEBUG -g" make
          chmod +x tests/run_perft_tests.sh tests/run_fen_tests.sh
          ./tests/run_perft_tests.sh
          ./tests/run_fen_tests.sh

  sanitize:
    name: perft tests (sanitized, nightly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc make

      - name: Build with sanitizers
        run: |
          make CFLAGS='-Iinclude -std=c11 -g -O0 -fsanitize=address,undefined -fno-omit-frame-pointer -Wall -Wextra' all

      - name: Run perft tests (sanitized)
        run: |
          chmod +x tests/run_perft_tests.sh
          ./tests/run_perft_tests.sh
