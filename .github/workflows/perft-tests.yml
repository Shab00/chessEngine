name: perft tests

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * *'   # nightly at 03:00 UTC (adjust if you want)

jobs:
  test:
    name: perft tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc make

      - name: Build
        run: make

      - name: Run perft tests
        run: ./build/perft_runner runfile

  sanitize:
    name: perft tests (sanitized, nightly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc make

      - name: Build with sanitizers
        run: |
          make CFLAGS='-Iinclude -std=c11 -g -O0 -fsanitize=address,undefined -fno-omit-frame-pointer -Wall -Wextra' all

      - name: Run perft tests (sanitized)
        run: ./build/perft_runner runfile
